<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Zine Multi-Page AR | Digital Poetics Press</title>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
    #scan-hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(13, 13, 13, 0.85);
      color: #f7f4ee;
      border: 1px solid #444;
      border-radius: 999px;
      padding: 0.6rem 1.4rem;
      font-size: 0.8rem;
      pointer-events: none;
      transition: opacity 0.4s ease;
      white-space: nowrap;
    }
    a-scene { width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>

  <div id="scan-hint">Point camera at Page 1</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets timeout="10000">
      <!-- Only list files that ARE ACTUALLY in your repository -->
      <a-asset-item id="model-p1" src="./page1.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- PAGE 1 (Index 0 in your targets.mind) -->
    <a-entity mindar-image-target="targetIndex: 0" class="page-anchor" id="anchor-p1">
      <a-gltf-model src="#model-p1" position="0 0 0" rotation="0 0 0" scale="1 1 1"></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const hint = document.getElementById('scan-hint');
    const anchor = document.getElementById('anchor-p1');
    anchor.addEventListener('targetFound', () => { hint.style.opacity = '0'; });
    anchor.addEventListener('targetLost', () => { hint.style.opacity = '1'; });
  </script>
</body>
</html>
